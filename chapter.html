<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>阅读 · 旧神与钢铁</title>
<meta name="description" content="《旧神与钢铁》正文在线阅读。">

<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="progress" id="progress" aria-hidden="true"></div>

<div class="topbar">

    <a class="back" href="index.html">← 目录</a>
    <span class="here" id="here"></span>
    <div class="size" role="group" aria-label="字号">
      <button type="button" data-size="17" aria-pressed="false">A</button>

      <button type="button" data-size="22" aria-pressed="false">A</button>

  <nav class="pager" id="pager" aria-label="章节导航"></nav>

  </div>

<script src="data/chapters.js"></script>
<script src="assets/app.js"></script>
<script>

  if (!window.__NOVEL__) {
    document.getElementById('fallback').hidden = false;
    document.getElementById('chapter-head').innerHTML = '';
  }
</script>
